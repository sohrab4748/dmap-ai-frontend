[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmap-local-worker"
version = "0.1.0"
description = "Resumable local ESGF downloader and station-ensemble processor for DMAP-AI"
requires-python = ">=3.10"
dependencies = [
  "dask[array]>=2024.1",
  "netCDF4>=1.6",
  "numpy>=1.26",
  "pandas>=2.1",
  "xarray>=2024.1"
]

[project.scripts]
dmap-worker = "dmap_worker.cli:main"

[tool.setuptools.packages.find]
include = ["dmap_worker*"]
