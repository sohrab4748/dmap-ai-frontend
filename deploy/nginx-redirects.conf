# nginx-redirects.conf — 301 redirects for URLs Google reports as 404.
#
# HOW TO USE (on the DigitalOcean droplet):
# 1. Copy this file:  sudo cp deploy/nginx-redirects.conf /etc/nginx/snippets/dmap-redirects.conf
# 2. In your server block (/etc/nginx/sites-available/...), inside `server { }`, add:
#        include /etc/nginx/snippets/dmap-redirects.conf;
# 3. Test and reload:  sudo nginx -t && sudo systemctl reload nginx
#
# GETTING THE URL LIST:
# Google Search Console -> Indexing -> Pages -> "Not found (404)" -> open -> EXPORT.
# Add one `location = ` line per old URL below, pointing to the closest CURRENT page
# (not everything to the homepage). Delete the examples you don't need.
#
# NOTE: /sv_tutorial is intentionally NOT redirected — it is the live written guide,
# linked from tutorials.html and spi_tutorial.html.

# --- EXAMPLES (replace with the real 404 URLs from GSC) ---------------------
# location = /old-tutorial-page   { return 301 /tutorials; }
# location = /spi-analysis        { return 301 /DMAP_AI_App; }
# location = /farmer              { return 301 /farmer-version; }
# location = /knowledge/old-slug/ { return 301 /knowledge/new-slug/; }
# ----------------------------------------------------------------------------

